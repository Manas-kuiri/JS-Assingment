<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rells Scroling Feature</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <main>
      <section>
        <div class="all-reels">
          <div class="reel">
            <video autoplay loop muted src=""></video>
            <div class="bottom">
              <div class="user">
                <img
                  src="https://plus.unsplash.com/premium_photo-1738090991042-eeab1d1319d4?q=80&w=681&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                  alt=""
                />
                <h4>Giulia Squillace</h4>
                <button>Follow</button>
              </div>
              <h3>
                Maya Hoge Maya New Cg Tranding Viral Song #shortsfeed #cgsong
              </h3>
            </div>
            <div class="right">
                  <div class="like">
                        <h4 class="like-icon"><i class="ri-heart-line"></i></h4>
                        <h6>500</h6>
                  </div>
                   <div class="comment">
                        <h4 class="comment-icon"><i class="ri-chat-3-fill"></i></h4>
                        <h6>80</h6>
                  </div>
                   <div class="share">
                        <h4 class="share-icon"><i class="ri-share-forward-fill"></i></i></h4>
                        <h6>2.3k</h6>
                  </div>
                   <div class="save">
                        <h4 class="save-icon"><i class="ri-save-3-line"></i></h4>
                        <h6>367</h6>
                  </div>
                  <div class="three-dot">
                        <h4 class="threedot-icon"><i class="ri-more-2-fill"></i></h4>
                  </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
